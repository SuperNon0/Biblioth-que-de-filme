{% extends "_base.html" %}
{% block titre %}Demande refusée · cinéthèque{% endblock %}
{% block classe %}login-page{% endblock %}
{% block corps %}
<main class="login-card">
  <div class="login-logo">{% include "_logo.html" %}</div>
  <div class="access-icon err"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></div>
  <h1 class="h-acces">Demande refusée</h1>
  <span class="mail-chip">{{ email }}</span>
  <p class="access-text">Un administrateur a refusé ta demande d'accès à cinéthèque.</p>
  <form method="post" action="{{ url_for('auth.request_access') }}">
    <button type="submit" class="btn w">Redemander un accès</button>
  </form>
</main>
{% endblock %}
